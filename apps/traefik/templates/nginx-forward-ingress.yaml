{{- if .Values.nginxForward.enabled }}
{{- $root := . }}
{{- $hosts := $root.Values.nginxForward.hosts | default (list $root.Values.nginxForward.host) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-nginx-forward
  namespace: {{ .Release.Namespace }}
  {{- with .Values.nginxForward.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.nginxForward.ingressClassName | default "nginx" | quote }}
  {{- if .Values.nginxForward.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.nginxForward.tls.secretName | quote }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $root.Values.nginxForward.service.name | quote }}
                port:
                  number: {{ $root.Values.nginxForward.service.port }}
    {{- end }}
{{- end }}
