apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-lapi-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/component: lapi
data:
  acquis.yaml: |
    ---
    filenames:
      - /var/log/traefik/access.log
    labels:
      type: traefik

  profiles.yaml: |
    ---
    name: default_ip_remediation
    filters:
     - Alert.Remediation == true && Alert.GetScope() == "Ip"
    decisions:
     - type: ban
       duration: 4h
    on_success: break

  simulation.yaml: |
    ---
    simulation: false

  init-patterns: |
    # Placeholder - patterns are loaded from hub

  config.yaml: |
    ---
    common:
      daemonize: false
      log_media: stdout
      log_level: info
      working_dir: /var/lib/crowdsec/data

    config_paths:
      config_dir: /etc/crowdsec
      data_dir: /var/lib/crowdsec/data
      simulation_path: /etc/crowdsec/simulation.yaml
      hub_dir: /etc/crowdsec/hub
      index_path: /etc/crowdsec/hub/.index.json

    crowdsec_service:
      acquisition_path: /etc/crowdsec/acquis.yaml
      parser_routines: 1

    cscli:
      output: human

    db_config:
      type: sqlite
      db_path: /var/lib/crowdsec/data/crowdsec.db
      flush:
        max_items: 5000
        max_age: 7d

    api:
      client:
        insecure_skip_verify: false
        credentials_path: /var/lib/crowdsec/data/local_api_credentials.yaml
      server:
        log_level: info
        listen_uri: 0.0.0.0:8080
        profiles_path: /etc/crowdsec/profiles.yaml
        online_client:
          credentials_path: /var/lib/crowdsec/data/online_api_credentials.yaml
        tls:
          cert_file: ""
          key_file: ""

    prometheus:
      enabled: true
      level: full
      listen_addr: 0.0.0.0
      listen_port: 6060
