certificate:
  name: wildcard-lesicnik-eu
  secretName: default-tls-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.lesicnik.eu"
    - "lesicnik.eu"

gatewayClass:
  enabled: true
  name: traefik
  controllerName: traefik.io/gateway-controller

gateway:
  name: traefik-gateway
  className: traefik
  listeners:
    http:
      enabled: true
      port: 80
    https:
      enabled: true
      port: 443
      tls:
        secretName: default-tls-cert

crowdsec:
  middleware:
    enabled: true
    name: crowdsec-bouncer
  mode: stream
  lapi:
    scheme: http
    host: 127.0.0.1:8080
    path: /
    keyFile: /etc/crowdsec/api-key
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

externalSecret:
  enabled: true
  name: crowdsec-bouncer-api-key
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  remoteRef:
    key: secret/crowdsec
    property: api_key

traefik:
  providers:
    kubernetesGateway:
      enabled: true
    kubernetesIngress:
      enabled: false
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
  api:
    dashboard: true

  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.lesicnik.eu`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      entryPoints:
        - web
        - websecure
      tls:
        secretName: default-tls-cert

  gateway:
    enabled: false

  service:
    type: LoadBalancer
    loadBalancerIP: "192.168.10.90"

  logs:
    access:
      enabled: true
      filePath: /var/log/traefik/access.log

  deployment:
    additionalVolumes:
      - name: traefik-logs
        emptyDir: {}
      - name: crowdsec-config-files
        configMap:
          name: crowdsec-lapi-config
      - name: crowdsec-data
        persistentVolumeClaim:
          claimName: crowdsec-lapi-data
    initContainers:
      - name: crowdsec-install
        image: crowdsecurity/crowdsec:v1.7.4
        command:
          - sh
          - -c
          - |
            set -e
            echo "Installing CrowdSec collections and parsers..."
            cscli hub update
            echo "Installing collection: crowdsecurity/traefik"
            cscli collections install crowdsecurity/traefik --force
            echo "Installing collection: crowdsecurity/http-cve"
            cscli collections install crowdsecurity/http-cve --force
            echo "Installing collection: crowdsecurity/whitelist-good-actors"
            cscli collections install crowdsecurity/whitelist-good-actors --force
            echo "Installing collection: crowdsecurity/base-http-scenarios"
            cscli collections install crowdsecurity/base-http-scenarios --force
            echo "Installing parser: crowdsecurity/traefik-logs"
            cscli parsers install crowdsecurity/traefik-logs --force
            if [ ! -f /etc/crowdsec/patterns/.installed ]; then
              echo "Copying base patterns..."
              cp -r /staging/etc/crowdsec/patterns/* /etc/crowdsec/patterns/ 2>/dev/null || true
              touch /etc/crowdsec/patterns/.installed
            fi
            touch /var/lib/crowdsec/data/online_api_credentials.yaml
            if [ -d /var/lib/crowdsec/data/console.yaml ]; then
              rm -rf /var/lib/crowdsec/data/console.yaml
            fi
            touch /var/lib/crowdsec/data/console.yaml
        volumeMounts:
          - name: crowdsec-data
            mountPath: /var/lib/crowdsec/data
          - name: crowdsec-config-files
            mountPath: /etc/crowdsec/config.yaml
            subPath: config.yaml
          - name: crowdsec-data
            mountPath: /etc/crowdsec/hub
            subPath: hub
          - name: crowdsec-data
            mountPath: /etc/crowdsec/collections
            subPath: collections
          - name: crowdsec-data
            mountPath: /etc/crowdsec/contexts
            subPath: contexts
          - name: crowdsec-data
            mountPath: /etc/crowdsec/parsers
            subPath: parsers
          - name: crowdsec-data
            mountPath: /etc/crowdsec/scenarios
            subPath: scenarios
          - name: crowdsec-data
            mountPath: /etc/crowdsec/postoverflows
            subPath: postoverflows
          - name: crowdsec-data
            mountPath: /etc/crowdsec/patterns
            subPath: patterns
    additionalContainers:
      - name: crowdsec
        image: crowdsecurity/crowdsec:v1.7.4
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -e
            if ! cscli machines list 2>/dev/null | grep -q "crowdsec-agent"; then
              cscli machines add crowdsec-agent --password crowdsec-agent-password --auto --file /var/lib/crowdsec/data/local_api_credentials.yaml
            fi
            exec crowdsec -c /etc/crowdsec/config.yaml
        env:
          - name: TZ
            value: UTC
          - name: DISABLE_ONLINE_API
            value: "false"
          - name: LOCAL_API_URL
            value: "http://127.0.0.1:8080"
        ports:
          - name: lapi
            containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
          - name: crowdsec-config-files
            mountPath: /etc/crowdsec/acquis.yaml
            subPath: acquis.yaml
          - name: crowdsec-config-files
            mountPath: /etc/crowdsec/profiles.yaml
            subPath: profiles.yaml
          - name: crowdsec-config-files
            mountPath: /etc/crowdsec/simulation.yaml
            subPath: simulation.yaml
          - name: crowdsec-config-files
            mountPath: /etc/crowdsec/config.yaml
            subPath: config.yaml
          - name: crowdsec-data
            mountPath: /var/lib/crowdsec/data
          - name: crowdsec-data
            mountPath: /etc/crowdsec/hub
            subPath: hub
          - name: crowdsec-data
            mountPath: /etc/crowdsec/collections
            subPath: collections
          - name: crowdsec-data
            mountPath: /etc/crowdsec/console.yaml
            subPath: console.yaml
          - name: crowdsec-data
            mountPath: /etc/crowdsec/contexts
            subPath: contexts
          - name: crowdsec-data
            mountPath: /etc/crowdsec/parsers
            subPath: parsers
          - name: crowdsec-data
            mountPath: /etc/crowdsec/scenarios
            subPath: scenarios
          - name: crowdsec-data
            mountPath: /etc/crowdsec/postoverflows
            subPath: postoverflows
          - name: crowdsec-data
            mountPath: /etc/crowdsec/patterns
            subPath: patterns
          - name: traefik-logs
            mountPath: /var/log/traefik
            readOnly: true

  additionalVolumeMounts:
    - name: traefik-logs
      mountPath: /var/log/traefik

  podSecurityContext:
    fsGroup: 65532

  ports:
    web:
      port: 80
    websecure:
      port: 443
    traefik:
      port: 8082
      exposedPort: 8082

  additionalArguments:
    - "--entrypoints.web.http.middlewares=traefik-crowdsec-bouncer@kubernetescrd"
    - "--entrypoints.websecure.http.middlewares=traefik-crowdsec-bouncer@kubernetescrd"

  volumes:
    - name: crowdsec-bouncer-api-key
      type: secret
      mountPath: /etc/crowdsec

  experimental:
    plugins:
      crowdsec-bouncer:
        moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
        version: v1.4.7
