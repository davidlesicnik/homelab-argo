mariadb:
  enabled: true
  image:
    tag: 11.8.3
  auth:
    database: booklore
    username: booklore-user

image:
  repository: booklore/booklore
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 6060

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: books.lesicnik.eu
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: books-lesicnik-eu-tls
      hosts:
        - books.lesicnik.eu

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  tcpSocket:
    port: http
readinessProbe:
  tcpSocket:
    port: http

persistence:
  dataVolume:
    enabled: true
    size: 1Gi
    existingClaim: ""
  booksVolume:
    enabled: true
    size: 20Gi
    existingClaim: ""

# NFS mount for media storage
nfs:
  enabled: true
  server: 192.168.10.9
  path: /volume1/media
  mountPath: /media

extraVolumes: []

extraVolumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
