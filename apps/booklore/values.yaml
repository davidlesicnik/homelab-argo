mariadb:
  enabled: true
  image:
    repository: mariadb
    tag: "11.8.5"
  auth:
    database: booklore
    username: booklore-user
  persistence:
    storageClass: longhorn
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 512
    limits:
      cpu: 300m
      memory: 768Mi

image:
  repository: booklore/booklore
  pullPolicy: IfNotPresent
  tag: v1.18.4

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 6060

gateway:
  name: traefik-gateway
  namespace: traefik
  httpSectionName: http
  httpsSectionName: https

route:
  enabled: true
  hostname: books.lesicnik.eu
  path: /

resources:
  requests:
    cpu: 20m
    memory: 512Mi
  limits:
    cpu: 200m
    memory: 768Mi

livenessProbe:
  tcpSocket:
    port: http
readinessProbe:
  tcpSocket:
    port: http

# External Secret configuration
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  remoteRef:
    key: secret/booklore
  existingSecret: booklore-mariadb-secret

persistence:
  dataVolume:
    enabled: true
    size: 1Gi
    existingClaim: ""
  booksVolume:
    enabled: true
    size: 20Gi
    existingClaim: ""

# NFS mount for media storage
nfs:
  enabled: true
  server: 192.168.10.9
  path: /volume1/media
  mountPath: /media

extraVolumes: []

extraVolumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
