{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.existingSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecret.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: mariadb-password
      remoteRef:
        key: {{ .Values.externalSecret.remoteRef.key }}
        property: mariadb_password
    - secretKey: mariadb-root-password
      remoteRef:
        key: {{ .Values.externalSecret.remoteRef.key }}
        property: mariadb_root_password
{{- end }}
