apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openproject.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app: {{ include "openproject.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "openproject.name" . }}
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ['sh', '-c', 'chmod -R 777 /var/openproject/assets && chown -R 1000:1000 /var/openproject/assets']
          volumeMounts:
            - name: data
              mountPath: /var/openproject/assets
          securityContext:
            runAsUser: 0
        - name: db-migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["bundle", "exec", "rails", "db:migrate"]
          env:
          {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}@openproject-postgres:5432/{{ .Values.postgres.database }}?password=$(POSTGRES_PASSWORD)"
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecret.existingSecret }}
          volumeMounts:
            - name: data
              mountPath: /var/openproject/assets
        - name: db-seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["bundle", "exec", "rails", "db:seed"]
          env:
          {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}@openproject-postgres:5432/{{ .Values.postgres.database }}?password=$(POSTGRES_PASSWORD)"
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecret.existingSecret }}
          volumeMounts:
            - name: data
              mountPath: /var/openproject/assets
      containers:
        - name: openproject
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}@openproject-postgres:5432/{{ .Values.postgres.database }}?password=$(POSTGRES_PASSWORD)"
          envFrom:
            - secretRef:
                name: {{ .Values.externalSecret.existingSecret }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/openproject/assets
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
      restartPolicy: {{ .Values.restartPolicy }}
