service:
  type: ClusterIP
  port: 8080

image:
  repository: ghcr.io/hargata/lubelogger
  tag: latest
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: fuel.lesicnik.eu
      paths:
        - path: /
          pathType: Prefix
        - path: /signin-oidc
          pathType: Prefix    
    - secretName: fuel-lesicnik-eu-tls
      hosts:
        - fuel.lesicnik.eu

env:
  LANG: "en_US"
  LC_ALL: "en_US"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  storageClass: "longhorn"
  size: 2Gi

externalSecrets:
  enabled: true
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore
  vault:
    path: "secret/lubelogger/"
    passwordKey: "db_password"

postgresql:
  enabled: true
  auth:
    username: lubelogger
    database: lubelogger
    existingSecret: lubelogger-postgresql-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      storageClass: "longhorn"
      size: 5Gi