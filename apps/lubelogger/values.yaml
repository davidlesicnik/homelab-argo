service:
  type: ClusterIP
  port: 8080

image:
  repository: ghcr.io/hargata/lubelogger
  tag: v1.5.7
  pullPolicy: IfNotPresent

ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: fuel.lesicnik.eu
      paths:
        - path: /
          pathType: Prefix
        - path: /Login/RemoteAuth
          pathType: Prefix    
  tls:
    - secretName: fuel-lesicnik-eu-tls
      hosts:
        - fuel.lesicnik.eu

gateway:
  name: traefik-gateway
  namespace: traefik
  httpSectionName: http
  httpsSectionName: https

route:
  enabled: true
  hostname: fuel.lesicnik.eu
  path: /

env:
  LANG: "en_US"
  LC_ALL: "sl_SI"

resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    cpu: 100m
    memory: 200Mi

persistence:
  storageClass: "longhorn"
  size: 2Gi

externalSecrets:
  enabled: true
  secretStore:
    name: vault-backend
    kind: ClusterSecretStore
  vault:
    path: "secret/lubelogger/"
    passwordKey: "db_password"

postgresql:
  enabled: true
  auth:
    username: lubelogger
    database: lubelogger
    existingSecret: lubelogger-postgresql-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      storageClass: "longhorn"
      size: 5Gi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
