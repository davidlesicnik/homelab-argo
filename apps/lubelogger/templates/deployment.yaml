apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lubelogger.fullname" . }}
  labels:
    {{- include "lubelogger.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "lubelogger.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lubelogger.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        image: "{{ .Values.image.repository | default "ghcr.io/hargata/lubelogger" }}:{{ .Values.image.tag | default "latest" }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: LANG
          value: {{ .Values.env.LANG | default "en_US" | quote }}
        - name: LC_ALL
          value: {{ .Values.env.LC_ALL | default "en_US" | quote }}
        {{- if .Values.postgresql.enabled }}
        - name: POSTGRES_CONNECTION
          valueFrom:
            secretKeyRef:
              name: {{ include "lubelogger.fullname" . }}-postgresql-secret
              key: connection-string
        {{- end }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          limits:
            cpu: {{ .Values.resources.limits.cpu | default "500m" }}
            memory: {{ .Values.resources.limits.memory | default "512Mi" }}
          requests:
            cpu: {{ .Values.resources.requests.cpu | default "100m" }}
            memory: {{ .Values.resources.requests.memory | default "128Mi" }}
        volumeMounts:
        - name: data
          mountPath: /App/config
        - name: data
          mountPath: /App/data
        - name: data
          mountPath: /App/log
        - name: data
          mountPath: /App/wwwroot/translations
        - name: data
          mountPath: /App/wwwroot/temp
        - name: data
          mountPath: /App/wwwroot/documents
        - name: data
          mountPath: /App/wwwroot/images
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "lubelogger.fullname" . }}