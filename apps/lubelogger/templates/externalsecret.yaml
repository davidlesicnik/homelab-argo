{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lubelogger.fullname" . }}-postgresql-secret
  labels:
    {{- include "lubelogger.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ include "lubelogger.fullname" . }}-postgresql-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # PostgreSQL secrets
        postgres-password: "{{ `{{ .db_password }}` }}"
        password: "{{ `{{ .db_password }}` }}"
        # Connection string for LubeLogger
        connection-string: "Host={{ include "lubelogger.fullname" . }}-postgresql;Database={{ .Values.postgresql.auth.database }};Username={{ .Values.postgresql.auth.username }};Password={{ `{{ .db_password }}` }}"
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.vault.path }}
{{- end }}