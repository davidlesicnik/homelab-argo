{{- $enabledServices := dict }}
{{- range $name, $config := .Values.internalServices }}
{{- if $config.enabled }}
{{- $_ := set $enabledServices $name $config }}
{{- end }}
{{- end }}
{{- if gt (len $enabledServices) 0 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reverse-proxy-internal
  namespace: {{ .Release.Namespace }}
  labels:
    app: reverse-proxy
    chart: {{ .Chart.Name }}
    type: internal
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- range $name, $config := $enabledServices }}
    {{- with $config.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  {{- range $name, $config := $enabledServices }}
  - secretName: {{ $name }}-{{ $.Values.ingress.tls.secretName }}
    hosts:
      - {{ $config.host }}
  {{- end }}
  {{- end }}
  rules:
  {{- range $name, $config := $enabledServices }}
  - host: {{ $config.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $name }}-local
            port:
              number: {{ $config.port }}
  {{- end }}
{{- end }}
