{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "wg-easy.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: wg-easy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Create before deployment
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "wg-easy.fullname" . }}-secret
    creationPolicy: Owner
  data:
    - secretKey: PASSWORD_HASH
      remoteRef:
        key: {{ .Values.externalSecret.remoteRef.key }}
        property: {{ .Values.externalSecret.remoteRef.property }}
{{- end }}
