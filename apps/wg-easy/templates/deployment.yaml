apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: wg-easy
  template:
    metadata:
      labels:
        app: wg-easy
    spec:
      containers:
        - name: wg-easy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: web
              containerPort: {{ .Values.service.webPort }}
              protocol: TCP
            - name: vpn
              containerPort: {{ .Values.service.vpnPort }}
              protocol: {{ .Values.service.vpnPortProtocol }}
          env:
            {{- if .Values.externalSecret.enabled }}
            - name: PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "wg-easy.fullname" . }}-secret
                  key: PASSWORD_HASH
            {{- else if .Values.env.PASSWORD_HASH }}
            - name: PASSWORD_HASH
              value: {{ .Values.env.PASSWORD_HASH | quote }}
            {{- end }}
            - name: WG_HOST
              value: {{ .Values.env.WG_HOST | quote }}
            - name: WG_DEFAULT_ADDRESS
              value: {{ .Values.env.WG_DEFAULT_ADDRESS | quote }}
            - name: WG_DEFAULT_DNS
              value: {{ .Values.env.WG_DEFAULT_DNS | quote }}
            - name: WG_MTU
              value: {{ .Values.env.WG_MTU | quote }}
            - name: WG_ALLOWED_IPS
              value: {{ .Values.env.WG_ALLOWED_IPS | quote }}
            - name: WG_PERSISTENT_KEEPALIVE
              value: {{ .Values.env.WG_PERSISTENT_KEEPALIVE | quote }}
            {{- if .Values.env.WG_POST_UP }}
            - name: WG_POST_UP
              value: {{ .Values.env.WG_POST_UP | quote }}
            {{- end }}
            {{- if .Values.env.WG_POST_DOWN }}
            - name: WG_POST_DOWN
              value: {{ .Values.env.WG_POST_DOWN | quote }}
            {{- end }}
            - name: UI_TRAFFIC_STATS
              value: {{ .Values.env.UI_TRAFFIC_STATS | quote }}
            - name: UI_CHART_TYPE
              value: {{ .Values.env.UI_CHART_TYPE | quote }}
            - name: LANG
              value: {{ .Values.env.LANG | quote }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.pvc.mountPath }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
