replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/wg-easy/wg-easy
  tag: "15.1.0"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  loadBalancerIP: "192.168.10.92"  # Static IP for port forwarding
  webPort: 51821
  vpnPort: 51820
  vpnPortProtocol: UDP

ingress:
  enabled: true
  hostname: wireguard.local
  ingressClassName: nginx
  annotations: {}
  tls:
    enabled: false

# PVC for WireGuard config
pvc:
  name: wg-easy-config
  storageClassName: longhorn
  size: 1Gi
  mountPath: /etc/wireguard

# External Secret configuration for Vault integration
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  remoteRef:
    key: secret/wg_easy
    property: password 

env:
  # Web UI password - managed by ExternalSecret when enabled
  # If externalSecret.enabled is false, set PASSWORD here manually
  PASSWORD: ""

  # v15 requires INSECURE=true for HTTP access (non-HTTPS)
  INSECURE: "true"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  # WireGuard needs NET_ADMIN capability
  # SYS_MODULE removed - Talos blocks it and has WireGuard built-in
  capabilities:
    add:
      - NET_ADMIN
