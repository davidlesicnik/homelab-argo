replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/wg-easy/wg-easy
  tag: "13"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  loadBalancerIP: "192.168.10.92"  # Static IP for port forwarding
  webPort: 51821
  vpnPort: 51820
  vpnPortProtocol: UDP

ingress:
  enabled: true
  hostname: wireguard.local
  ingressClassName: nginx
  annotations: {}
  tls:
    enabled: false

# PVC for WireGuard config
pvc:
  name: wg-easy-config
  storageClassName: longhorn
  size: 1Gi
  mountPath: /etc/wireguard

# External Secret configuration for Vault integration
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  remoteRef:
    key: secret/wg_easy
    property: password_hash

env:
  # Web UI password - managed by ExternalSecret when enabled
  # If externalSecret.enabled is false, set PASSWORD_HASH here manually
  PASSWORD_HASH: ""
  # WireGuard server settings
  WG_HOST: "wireguard.local"  # External hostname/IP for clients
  WG_DEFAULT_ADDRESS: "10.8.0.x"
  WG_DEFAULT_DNS: "1.1.1.1"
  WG_MTU: "1420"
  WG_ALLOWED_IPS: "0.0.0.0/0"
  WG_PERSISTENT_KEEPALIVE: "25"
  WG_POST_UP: ""
  WG_POST_DOWN: ""
  # UI settings
  UI_TRAFFIC_STATS: "true"
  UI_CHART_TYPE: "0"  # 0 for bar chart, 1 for line chart, 2 for area chart
  LANG: "en"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  # WireGuard needs NET_ADMIN capability
  # SYS_MODULE removed - Talos blocks it and has WireGuard built-in
  capabilities:
    add:
      - NET_ADMIN
