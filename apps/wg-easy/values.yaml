replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/wg-easy/wg-easy
  tag: "15.1.0"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  loadBalancerIP: "192.168.10.92"  # Static IP for port forwarding
  webPort: 51821
  vpnPort: 51820
  vpnPortProtocol: UDP

ingress:
  enabled: true
  hostname: wireguard.local
  ingressClassName: nginx
  annotations: {}
  tls:
    enabled: false

# PVC for WireGuard config
pvc:
  name: wg-easy-config
  storageClassName: longhorn
  size: 1Gi
  mountPath: /etc/wireguard

# External Secret configuration for Vault integration
# Note: v15 uses plain PASSWORD instead of PASSWORD_HASH
# Update your Vault secret to store a plain text password
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  remoteRef:
    key: secret/wg_easy
    property: password  # Changed from password_hash to password for v15

env:
  # Web UI password - managed by ExternalSecret when enabled
  # If externalSecret.enabled is false, set PASSWORD here manually
  # Note: v15 uses PASSWORD instead of PASSWORD_HASH
  PASSWORD: ""

  # v15 requires INSECURE=true for HTTP access (non-HTTPS)
  INSECURE: "true"

  # Optional: PORT and HOST can be set if needed
  # PORT: "51821"
  # HOST: "0.0.0.0"

  # Note: Most WireGuard settings (WG_HOST, WG_DEFAULT_ADDRESS, etc.)
  # have been moved to the Admin Panel in v15 and are no longer
  # configured via environment variables. Configure these through
  # the web UI after initial setup.

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  # WireGuard needs NET_ADMIN capability
  # SYS_MODULE removed - Talos blocks it and has WireGuard built-in
  capabilities:
    add:
      - NET_ADMIN
