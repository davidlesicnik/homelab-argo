replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/wg-easy/wg-easy
  tag: "15.1.0"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  loadBalancerIP: "192.168.10.92"  # Static IP for port forwarding
  webPort: 51821
  vpnPort: 51820
  vpnPortProtocol: UDP

ingress:
  enabled: false
  hostname: wireguard.lesicnik.eu
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    enabled: true
    secretName: wireguard-lesicnik-eu-tls

gateway:
  name: traefik-gateway
  namespace: traefik
  httpSectionName: http
  httpsSectionName: https

route:
  enabled: true
  hostname: wireguard.lesicnik.eu
  path: /

# PVC for WireGuard config
pvc:
  name: wg-easy-config
  storageClassName: longhorn
  size: 1Gi
  mountPath: /etc/wireguard

# External Secret configuration for Vault integration
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  remoteRef:
    key: secret/wg_easy
    property: password 

env:
  # v15 requires INSECURE=true for HTTP access (non-HTTPS)
  INSECURE: "false"

  INIT_ENABLED: "true"
  INIT_USERNAME: "admin"
  # INIT_PASSWORD is managed by ExternalSecret
  INIT_PASSWORD: ""
  INIT_HOST: "vpn.lesicnik.eu"  # External hostname/IP for VPN clients
  INIT_PORT: "51820"
  INIT_DNS: "1.1.1.1"
  INIT_IPV4_CIDR: "10.8.0.0/24"

resources:
  requests:
    cpu: 50m
    memory: 75Mi
  limits:
    cpu: 500m
    memory: 256Mi

securityContext:
  # WireGuard needs NET_ADMIN capability
  # SYS_MODULE removed - Talos blocks it and has WireGuard built-in
  capabilities:
    add:
      - NET_ADMIN
