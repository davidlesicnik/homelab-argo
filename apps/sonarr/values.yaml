replicaCount: 1

strategy:
  type: Recreate

image:
  repository: linuxserver/sonarr
  tag: "4.0.16"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8989

ingress:
  enabled: true
  hostname: sonarr.lesicnik.eu
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    enabled: true
    secretName: sonarr-lesicnik-eu-tls

# PVC for Sonarr config
pvc:
  name: sonarr-config
  storageClassName: longhorn
  size: 1Gi
  mountPath: /config

# NFS mount for media storage
nfs:
  enabled: true
  server: 192.168.10.9
  path: /volume1/media
  mountPath: /media

env:
  PUID: "1000"
  PGID: "1000"
  TZ: Europe/Ljubljana

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

securityContext:
  fsGroup: 1000
