apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocis
  labels:
    app: ocis
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ocis
  template:
    metadata:
      labels:
        app: ocis
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: ocis-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f {{ .Values.persistence.mountPath }}/config/ocis.yaml ]; then
                mkdir -p {{ .Values.persistence.mountPath }}/config
                ocis init --config-path {{ .Values.persistence.mountPath }}/config --insecure no
              fi
          env:
            - name: OCIS_URL
              value: {{ .Values.env.OCIS_URL | quote }}
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.existingSecret }}
                  key: IDM_ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
      containers:
        - name: ocis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["ocis"]
          args: ["server"]
          ports:
            - containerPort: {{ .Values.containerPort }}
              name: http
          env:
            - name: OCIS_URL
              value: {{ .Values.env.OCIS_URL | quote }}
            - name: OCIS_LOG_LEVEL
              value: {{ .Values.env.OCIS_LOG_LEVEL | quote }}
            - name: PROXY_TLS
              value: {{ .Values.env.PROXY_TLS | quote }}
            - name: OCIS_INSECURE
              value: {{ .Values.env.OCIS_INSECURE | quote }}
            - name: OCIS_CONFIG_DIR
              value: {{ .Values.persistence.mountPath }}/config
            - name: OCIS_BASE_DATA_PATH
              value: {{ .Values.persistence.mountPath }}
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.existingSecret }}
                  key: IDM_ADMIN_PASSWORD
            {{- if .Values.oidc.enabled }}
            # OIDC/SSO Configuration - External IdP
            - name: OCIS_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: IDP_ISS
              value: {{ .Values.oidc.issuer | quote }}
            - name: WEB_OIDC_METADATA_URL
              value: "{{ .Values.oidc.issuer }}.well-known/openid-configuration"
            - name: WEB_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.existingSecret }}
                  key: OIDC_CLIENT_ID
            - name: WEB_OIDC_SCOPE
              value: "openid profile email groups"
            - name: PROXY_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
              value: "none"
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: PROXY_USER_OIDC_CLAIM
              value: "preferred_username"
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
            # Role assignment from OIDC claims
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: "oidc"
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: "groups"
            - name: PROXY_ROLE_MAPPING
              value: "ocisAdmin:admin;authentik Admins:admin"
            # CSP config file to allow external IdP
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: "/etc/ocis/csp.yaml"
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if .Values.oidc.enabled }}
            - name: csp-config
              mountPath: /etc/ocis
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ocis-data
        {{- if .Values.oidc.enabled }}
        - name: csp-config
          configMap:
            name: ocis-csp-config
        {{- end }}
