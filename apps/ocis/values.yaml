image:
  repository: owncloud/ocis
  tag: "7.3.1"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 2Gi

persistence:
  storageClass: longhorn
  size: 20Gi
  mountPath: /var/lib/ocis

env:
  OCIS_URL: "https://cloud.lesicnik.eu"
  OCIS_LOG_LEVEL: "info"
  PROXY_TLS: "false"
  OCIS_INSECURE: "false"

# Authentik OIDC SSO Configuration
oidc:
  enabled: true
  issuer: "https://sso.lesicnik.eu/application/o/owncloud/"
  # clientId is stored in Vault as oidc_client_id

containerPort: 9200

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  remoteRef:
    key: secret/ocis
  existingSecret: ocis-secrets

ingress:
  enabled: true
  hostname: cloud.lesicnik.eu
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100g"
  tls:
    enabled: true
    secretName: cloud-lesicnik-eu-tls
