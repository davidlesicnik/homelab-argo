replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/stephanrutter/lemur-pitwall
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

gateway:
  name: traefik-gateway
  namespace: traefik
  httpSectionName: http
  httpsSectionName: https

route:
  enabled: true
  hostname: pitwall.lesicnik.eu
  path: /

resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 128Mi
