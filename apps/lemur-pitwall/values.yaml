replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/stephanrutter/lemur-pitwall
  tag: "latest"
  # Preferred for production pinning. Use the GHCR image/package digest,
  # not the GitHub Actions artifact (.dockerbuild) digest.
  digest: "sha256:92ea3fa11946f167e4fd553d9655ad7b870b4796b7acafcc1b6e4b499eb772a2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

gateway:
  name: traefik-gateway
  namespace: traefik
  httpSectionName: http
  httpsSectionName: https

route:
  enabled: true
  hostname: pitwall.lesicnik.eu
  path: /

resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 128Mi
