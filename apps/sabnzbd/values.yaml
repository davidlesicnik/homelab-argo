replicaCount: 1

strategy:
  type: Recreate

image:
  repository: linuxserver/sabnzbd
  tag: "4.5.5"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  webPort: 8080

gateway:
  name: traefik-gateway
  namespace: traefik
  httpSectionName: http
  httpsSectionName: https

route:
  enabled: true
  hostname: usenet.lesicnik.eu
  path: /

# PVC for SABnzbd config
pvc:
  name: sabnzbd-config
  storageClassName: longhorn
  size: 1Gi
  mountPath: /config

# NFS mount for media storage
nfs:
  enabled: true
  server: 192.168.10.9
  path: /volume1/media
  mountPath: /media

env:
  PUID: "1000"
  PGID: "1000"
  TZ: Europe/Ljubljana
  HOST_WHITELIST_ENTRIES: "usenet.lesicnik.eu"

resources:
  requests:
    cpu: 20m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 2Gi

securityContext:
  fsGroup: 1000
