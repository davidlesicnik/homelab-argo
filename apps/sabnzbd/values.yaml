replicaCount: 1

strategy:
  type: Recreate

image:
  repository: linuxserver/sabnzbd
  tag: "4.5.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  webPort: 8080

ingress:
  enabled: true
  hostname: usenet.lesicnik.eu
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    enabled: true
    secretName: usenet-lesicnik-eu-tls

# PVC for SABnzbd config
pvc:
  name: sabnzbd-config
  storageClassName: longhorn
  size: 1Gi
  mountPath: /config

# NFS mount for media storage
nfs:
  enabled: true
  server: 192.168.10.9
  path: /volume1/media
  mountPath: /media

env:
  PUID: "1000"
  PGID: "1000"
  TZ: Europe/Ljubljana
  HOST_WHITELIST_ENTRIES: "usenet.lesicnik.eu"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 2000m
    memory: 2Gi

securityContext:
  fsGroup: 1000
