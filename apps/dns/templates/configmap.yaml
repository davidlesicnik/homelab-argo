apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  Corefile: |
    # Split DNS for lesicnik.eu - internal resolution only
    lesicnik.eu:53 {
        errors
        log

        # Custom hosts for internal services
        hosts {
          {{- range $name, $config := .Values.services }}
          {{- if $config.enabled }}
          {{ $config.ip }} {{ $config.host }}
          {{- end }}
          {{- end }}

          fallthrough
        }

        # Forward non-matching lesicnik.eu queries to upstream
        # This allows public DNS records to still work
        forward . {{ .Values.upstream.primary }} {{ .Values.upstream.secondary }} {
          max_concurrent 1000
        }

        cache 30
        reload
    }

    # Block telemetry domains
    stats.grafana.org:53 {
        errors
        log
        template IN A {
          rcode NXDOMAIN
        }
        template IN AAAA {
          rcode NXDOMAIN
        }
    }

    # Handle all other DNS queries
    .:53 {
        errors
        log
        health {
          lameduck 5s
        }
        ready

        # Forward to upstream DNS servers
        forward . {{ .Values.upstream.primary }} {{ .Values.upstream.secondary }} {
          max_concurrent 1000
        }

        cache 30
        loop
        reload
        loadbalance
    }