nextcloud:
  image: nextcloud:latest
  replicas: 1
  domain: nextcloud.lesicnik.eu

  resources:
    requests:
      cpu: 50m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 2Gi

  persistence:
    storageClass: longhorn
    size: 50Gi
    mountPath: /var/www/html

postgres:
  image: postgres:18
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  persistence:
    size: 10Gi
    storageClass: longhorn
  user: nextcloud
  database: nextcloud

redis:
  image: redis:latest
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi

secrets:
  vaultPath: secret/data/nextcloud

containerPort: 80

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  remoteRef:
    key: secret/nextcloud
  existingSecret: nextcloud-secrets

gateway:
  name: traefik-gateway
  namespace: traefik
  httpSectionName: http
  httpsSectionName: https

route:
  enabled: true
  hostname: nextcloud.lesicnik.eu
  path: /
