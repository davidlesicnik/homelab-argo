apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ddns-updater.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ddns-updater.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "ddns-updater.fullname" . }}-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CLOUDFLARE_TOKEN: "{{ `{{ .token }}` }}"
  data:
    - secretKey: token
      remoteRef:
        key: secret/ddns
        property: token