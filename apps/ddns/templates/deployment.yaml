apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ddns-updater.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ddns-updater.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ddns-updater.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ddns-updater.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: default
      initContainers:
      - name: config-init
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          TOKEN=$(cat /var/run/secrets/ddns/api-token)
          sed "s/CLOUDFLARE_TOKEN_PLACEHOLDER/$TOKEN/g" /config-template/config.json.tpl > /config/config.json
        volumeMounts:
        - name: config-template
          mountPath: /config-template
        - name: config
          mountPath: /config
        - name: secret
          mountPath: /var/run/secrets/ddns
          readOnly: true
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /updater/data
        - name: secret
          mountPath: /var/run/secrets/ddns
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: config-template
        configMap:
          name: {{ include "ddns-updater.fullname" . }}-config
      - name: config
        emptyDir: {}
      - name: secret
        secret:
          secretName: {{ include "ddns-updater.fullname" . }}-secrets
          optional: true