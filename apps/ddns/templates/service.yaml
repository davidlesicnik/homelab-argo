apiVersion: v1
kind: Service
metadata:
  name: {{ include "ddns-updater.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ddns-updater.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ddns-updater.selectorLabels" . | nindent 4 }}