replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/dgtlmoon/changedetection.io
  tag: "0.54.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

gateway:
  name: traefik-gateway
  namespace: traefik
  httpSectionName: http
  httpsSectionName: https

route:
  enabled: true
  hostname: change.lesicnik.eu
  path: /

pvc:
  name: changedetection-data
  storageClassName: longhorn
  size: 10Gi
  mountPath: /datastore

env:
  TZ: Europe/Ljubljana
  BASE_URL: https://change.lesicnik.eu

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
