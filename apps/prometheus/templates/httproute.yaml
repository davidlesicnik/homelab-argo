{{- if .Values.route.enabled }}
{{- $gatewayName := default "traefik-gateway" .Values.gateway.name }}
{{- $gatewayNamespace := default "traefik" .Values.gateway.namespace }}
{{- $httpSection := default "http" .Values.gateway.httpSectionName }}
{{- $httpsSection := default "https" .Values.gateway.httpsSectionName }}
{{- $host := .Values.route.hostname }}
{{- $path := default "/" .Values.route.path }}
{{- $allowHttpRemoteWrite := default false .Values.route.allowHttpRemoteWrite }}
{{- $remoteWritePath := default "/api/v1/write" .Values.route.remoteWritePath }}
{{- $prometheus := index .Subcharts "prometheus" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-https
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: {{ $httpsSection }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $path | quote }}
      backendRefs:
        - name: {{ include "prometheus.server.fullname" $prometheus }}
          kind: Service
          port: {{ $prometheus.Values.server.service.servicePort }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-http-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: {{ $httpSection }}
  hostnames:
    - {{ $host | quote }}
  rules:
    {{- if $allowHttpRemoteWrite }}
    - matches:
        - path:
            type: Exact
            value: {{ $remoteWritePath | quote }}
      backendRefs:
        - name: {{ include "prometheus.server.fullname" $prometheus }}
          kind: Service
          port: {{ $prometheus.Values.server.service.servicePort }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ $path | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
