# CrowdSec Configuration
crowdsec:
  image:
    repository: crowdsecurity/crowdsec
    tag: v1.7.4
  replicas: 1

  # Collections to install (for detecting attacks)
  collections:
    - crowdsecurity/traefik
    - crowdsecurity/http-cve
    - crowdsecurity/whitelist-good-actors
    - crowdsecurity/base-http-scenarios

  # Parsers and scenarios
  parsers:
    - crowdsecurity/traefik-logs

  # Traefik access log configuration
  traefik:
    # Path where Traefik logs will be available
    # This will be mounted from a shared volume or read from Traefik pods
    accessLogPath: /var/log/traefik/access.log
    namespace: traefik
    # If reading from file, set to true. If reading from pod logs, set to false
    useLogFile: false

  # Persistent storage for CrowdSec database
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""  # Use default storage class

  # CrowdSec LAPI configuration
  lapi:
    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Service configuration
service:
  # LAPI service
  lapi:
    type: ClusterIP
    port: 8080
