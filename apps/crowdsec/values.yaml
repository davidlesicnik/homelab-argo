# CrowdSec Configuration
crowdsec:
  image:
    repository: crowdsecurity/crowdsec
    tag: v1.7.4
  replicas: 1

  # Collections to install (for detecting attacks)
  collections:
    - crowdsecurity/traefik
    - crowdsecurity/http-cve
    - crowdsecurity/whitelist-good-actors
    - crowdsecurity/base-http-scenarios

  # Parsers and scenarios
  parsers:
    - crowdsecurity/traefik-logs

  # Traefik access log configuration
  traefik:
    # Path where Traefik logs will be available
    # This will be mounted from a shared volume or read from Traefik pods
    accessLogPath: /var/log/traefik/access.log
    namespace: traefik
    # If reading from file, set to true. If reading from pod logs, set to false
    useLogFile: false

  # Persistent storage for CrowdSec database
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""  # Use default storage class

  # CrowdSec LAPI configuration
  lapi:
    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# CrowdSec Traefik Bouncer Configuration
bouncer:
  image:
    repository: fbonalair/traefik-crowdsec-bouncer
    tag: v0.5.0
  replicas: 1

  # Bouncer mode: can be 'stream' or 'live'
  # stream: maintains streaming connection to LAPI
  # live: queries LAPI for each decision
  mode: stream

  # Port the bouncer API listens on
  port: 8080

  # Update frequency for bouncer decisions (in seconds)
  updateIntervalSeconds: 60

  # Default decision if CrowdSec is unreachable
  # Can be 'allow' or 'deny'
  defaultDecision: allow

  # Resources
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Traefik Middleware configuration
middleware:
  enabled: true
  # The middleware will be named 'crowdsec' in the crowdsec namespace
  name: crowdsec

  # Custom ban page (optional)
  banPage:
    enabled: false
    html: |
      <!DOCTYPE html>
      <html>
      <head><title>Access Denied</title></head>
      <body><h1>Access Denied</h1><p>Your IP has been blocked due to suspicious activity.</p></body>
      </html>

# Service configuration
service:
  # LAPI service
  lapi:
    type: ClusterIP
    port: 8080

  # Bouncer service
  bouncer:
    type: ClusterIP
    port: 8080
