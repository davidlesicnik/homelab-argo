{{- if .Values.middleware.enabled }}
---
# Traefik Middleware for CrowdSec integration
# This middleware uses the ForwardAuth mechanism to check IPs against CrowdSec decisions
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.middleware.name }}
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/component: middleware
spec:
  forwardAuth:
    address: http://crowdsec-traefik-bouncer.crowdsec.svc.cluster.local:{{ .Values.service.bouncer.port }}/api/v1/forwardAuth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Crowdsec-Decision
---
# Cross-namespace middleware reference (for use in traefik namespace)
# This allows HTTPRoutes in the traefik namespace to reference the middleware in crowdsec namespace
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.middleware.name }}
  namespace: traefik
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/component: middleware
spec:
  forwardAuth:
    address: http://crowdsec-traefik-bouncer.crowdsec.svc.cluster.local:{{ .Values.service.bouncer.port }}/api/v1/forwardAuth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Crowdsec-Decision
{{- end }}
