---
# Static PV pointing to the existing Traefik Longhorn volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: traefik-logs-shared
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/component: lapi
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: pvc-38d25256-31ac-4647-9a8b-63d0a344a65b
    volumeAttributes:
      share: "true"
---
# PVC in crowdsec namespace binding to the shared PV
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik-logs
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/component: lapi
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  volumeName: traefik-logs-shared
  resources:
    requests:
      storage: 1Gi
