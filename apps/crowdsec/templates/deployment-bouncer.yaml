apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-traefik-bouncer
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/component: bouncer
spec:
  replicas: {{ .Values.bouncer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec
      app.kubernetes.io/component: bouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec
        app.kubernetes.io/component: bouncer
    spec:
      containers:
        - name: traefik-bouncer
          image: {{ .Values.bouncer.image.repository }}:{{ .Values.bouncer.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CROWDSEC_BOUNCER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-bouncer-api-key
                  key: api-key
            - name: CROWDSEC_AGENT_HOST
              value: "crowdsec-lapi.crowdsec.svc.cluster.local:8080"
            - name: CROWDSEC_BOUNCER_LOG_LEVEL
              value: "INFO"
            - name: GIN_MODE
              value: "release"
            # Bouncer behavior configuration
            - name: CROWDSEC_BOUNCER_BAN_DURATION
              value: "4h"
            - name: CROWDSEC_BOUNCER_UPDATE_FREQUENCY
              value: "{{ .Values.bouncer.updateIntervalSeconds }}s"
            - name: PORT
              value: "{{ .Values.bouncer.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.bouncer.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.bouncer.resources | nindent 12 }}
