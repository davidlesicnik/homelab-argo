server:
  resources:
    requests:
      cpu: 200m
      memory: 650Mi
    limits:
      cpu: 1000m
      memory: 1Gi
worker:
  resources:
    requests:
      cpu: 50m
      memory: 650Mi
    limits:
      cpu: 250m
      memory: 1Gi

postgresql:
  host: authentik-postgresql
  database: authentik
  user: authentik
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  host: authentik-redis
  resources:
    requests:
      cpu: 25m
      memory: 10Mi
    limits:
      cpu: 100m
      memory: 50Mi

gateway:
  name: traefik-gateway
  namespace: traefik
  httpSectionName: http
  httpsSectionName: https

route:
  enabled: true
  hostname: sso.lesicnik.eu
  path: /
