postgres:
  image: postgres:16
  database: grafana
  user: grafana
  persistence:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 350m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 300Mi

grafana:
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 5Gi
    accessModes:
      - ReadWriteOnce
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hosts:
      - grafana.lesicnik.eu
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana-lesicnik-eu-tls
        hosts:
          - grafana.lesicnik.eu
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
    port: 80
  grafana.ini:
    server:
      root_url: https://grafana.lesicnik.eu
      serve_from_sub_path: false
    database:
      type: postgres
      host: grafana-postgres:5432
      name: grafana
      user: grafana
      password: $__file{/etc/secrets/postgres/postgres-password}
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
      feedback_links_enabled: false
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: Jm3r0VomUFGablL7a3mZWvjEZj26R9xxATFPnLrE
      client_secret: $__file{/etc/secrets/auth_generic_oauth/client_secret}
      scopes: openid profile email groups
      auth_url: https://sso.lesicnik.eu/application/o/authorize/
      token_url: https://sso.lesicnik.eu/application/o/token/
      api_url: https://sso.lesicnik.eu/application/o/userinfo/
      allow_sign_up: true
      role_attribute_path: contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'
    feature_toggles:
      enable: provisioning kubernetesDashboards
  extraSecretMounts:
    - name: auth-generic-oauth-secret-mount
      secretName: grafana-admin-secret
      defaultMode: 0440
      mountPath: /etc/secrets/auth_generic_oauth
      readOnly: true
      subPath: ""
    - name: postgres-secret-mount
      secretName: grafana-admin-secret
      defaultMode: 0440
      mountPath: /etc/secrets/postgres
      readOnly: true
      subPath: ""
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.prometheus.svc.cluster.local:80
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 30s
  resources:
    requests:
      cpu: 175m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi