replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/immich-app/immich-server
  tag: "v2.3.1"
  pullPolicy: IfNotPresent

# Immich machine learning service
machineLearning:
  enabled: true
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: "v2.3.1"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
    limits:
      cpu: 1000m
      memory: 2Gi

service:
  type: ClusterIP
  port: 2283

ingress:
  enabled: true
  className: "nginx"
  hostname: photos.lesicnik.eu
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  tls:
    enabled: true
    secretName: immich-tls

# Main storage for photos/videos
persistence:
  storageClass: "longhorn"
  size: 75Gi
  mountPath: /usr/src/app/upload

# Model cache storage
modelCache:
  storageClass: "longhorn"
  size: 10Gi
  mountPath: /cache

env:
  TZ: Europe/Ljubljana
  IMMICH_VERSION: release
  LOG_LEVEL: log
  DB_HOSTNAME: immich-postgresql
  DB_USERNAME: immich
  DB_DATABASE_NAME: immich
  DB_PORT: "5432"
  REDIS_HOSTNAME: immich-redis
  REDIS_PORT: "6379"
  REDIS_DBINDEX: "0"

resources:
  requests:
    cpu: 100m
    memory: 750Mi
  limits:
    cpu: 1000m
    memory: 1500Mi

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    username: immich
    database: immich
  primary:
    persistence:
      storageClass: "longhorn"
      size: 10Gi
  resources:
    requests:
      cpu: 10m
      memory: 200Mi
    limits:
      cpu: 300m
      memory: 768Mi

# External Secret configuration
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  remoteRef:
    key: secret/immich
  existingSecret: immich-postgresql-secret

# Redis configuration
redis:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  persistence:
    storageClass: "longhorn"
    size: 1Gi

# Immich Kiosk configuration
kiosk:
  enabled: true
  image:
    repository: damongolding/immich-kiosk
    tag: "latest"
    pullPolicy: Always
  service:
    port: 3000
  ingress:
    enabled: true
    className: "nginx"
    hostname: kiosk.lesicnik.eu
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    tls:
      enabled: true
      secretName: immich-kiosk-tls
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
