replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/immich-app/immich-server
  tag: "v1.122.3"
  pullPolicy: IfNotPresent

# Immich machine learning service
machineLearning:
  enabled: true
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: "v1.122.3"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: true
  className: "nginx"
  hostname: photos.lesicnik.eu
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  tls:
    enabled: true
    secretName: immich-tls

# Main storage for photos/videos
persistence:
  storageClass: "longhorn"
  size: 75Gi
  mountPath: /usr/src/app/upload

# Model cache storage
modelCache:
  storageClass: "longhorn"
  size: 10Gi
  mountPath: /cache

env:
  TZ: Europe/Ljubljana
  IMMICH_VERSION: release
  LOG_LEVEL: log
  DB_HOSTNAME: immich-postgresql
  DB_USERNAME: immich
  DB_DATABASE_NAME: immich
  DB_PORT: "5432"
  REDIS_HOSTNAME: immich-redis
  REDIS_PORT: "6379"
  REDIS_DBINDEX: "0"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    username: immich
    database: immich
    password: "immich-change-me-in-production"
  primary:
    persistence:
      storageClass: "longhorn"
      size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Redis configuration
redis:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    storageClass: "longhorn"
    size: 1Gi
