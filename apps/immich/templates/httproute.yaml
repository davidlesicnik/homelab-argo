{{- $gatewayName := default "traefik-gateway" .Values.gateway.name }}
{{- $gatewayNamespace := default "traefik" .Values.gateway.namespace }}
{{- $httpSection := default "http" .Values.gateway.httpSectionName }}
{{- $httpsSection := default "https" .Values.gateway.httpsSectionName }}
{{- if .Values.route.enabled }}
{{- $host := .Values.route.hostname }}
{{- $path := default "/" .Values.route.path }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-https
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: {{ $httpsSection }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $path | quote }}
      backendRefs:
        - name: immich-server
          kind: Service
          port: {{ .Values.service.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-http-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: {{ $httpSection }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $path | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- if and .Values.kiosk.enabled .Values.kiosk.route.enabled }}
{{- $kioskHost := .Values.kiosk.route.hostname }}
{{- $kioskPath := default "/" .Values.kiosk.route.path }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-kiosk-https
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: {{ $httpsSection }}
  hostnames:
    - {{ $kioskHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $kioskPath | quote }}
      backendRefs:
        - name: immich-server
          kind: Service
          port: {{ .Values.kiosk.service.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-kiosk-http-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
      sectionName: {{ $httpSection }}
  hostnames:
    - {{ $kioskHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $kioskPath | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
