replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/stephanrutter/lemur_wss
  tag: "latest"
  # Preferred for production pinning. Use the GHCR image/package digest,
  # not the GitHub Actions artifact (.dockerbuild) digest.
  digest: "sha256:4a4767163891597e37d52006ec5461347fd6b32f3e7736bdb0cb1c48e5690881"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

gateway:
  name: traefik-gateway
  namespace: traefik
  httpSectionName: http
  httpsSectionName: https

route:
  enabled: true
  hostname: lemur.lesicnik.eu
  path: /

resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 128Mi
